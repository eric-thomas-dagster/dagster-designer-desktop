[package]
name = "dagster-designer"
version = "0.1.0"
description = "Dagster Designer desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform by design -- its own apply_vibrancy/apply_mica/apply_acrylic
# are individually cfg-gated per OS internally (with a graceful
# UnsupportedPlatform error on anything else), so it doesn't need to be
# scoped to a single target.'cfg(...)' platform the way it was before --
# that's exactly why the Windows build failed to link it at all despite
# main.rs's own #[cfg(target_os = "windows")] call to it.
window-vibrancy = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
