[package]
name = "dagster-designer"
version = "0.1.0"
description = "Dagster Designer desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform by design -- its own apply_vibrancy/apply_mica/apply_acrylic
# are individually cfg-gated per OS internally (with a graceful
# UnsupportedPlatform error on anything else), so it doesn't need to be
# scoped to a single target.'cfg(...)' platform the way it was before --
# that's exactly why the Windows build failed to link it at all despite
# main.rs's own #[cfg(target_os = "windows")] call to it.
window-vibrancy = "0.6"
# API keys in the OS keychain (macOS Keychain, Windows Credential Manager, the Linux secret service). `vendored` builds the
# Linux D-Bus client in so no system libdbus is needed.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
