name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # false = build every platform and keep the installers as run artifacts, but publish nothing: no release, no
      # update feed. For trying a change to the build itself without touching what people download or auto-update to.
      publish:
        description: Publish the build (release + update feed)
        type: boolean
        default: true
      # The dagster_designer branch or commit to build and test (default: main). Only main can be published.
      product_ref:
        description: dagster_designer branch or commit to build (only main can be published)
        type: string
        default: main

permissions:
  contents: write

# One release at a time: two runs would race on the same tags and the rolling "latest" release. A run that starts while
# another is going waits its turn.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One dagster_designer commit for the whole run: the tests, the release notes and every platform's build use exactly it, and
  # the release says it was built from it (the automatic check relies on that).
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Pin the commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.product_ref || 'main' }}
          PUBLISHING: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ "$PUBLISHING" = "true" ] && [ "$REF" != "main" ]; then
            echo "::error::Only main can be published. Untick Publish to try another ref."
            exit 1
          fi
          echo "sha=$(gh api "repos/eric-thomas-dagster/dagster_designer/commits/$REF" --jq .sha)" >> "$GITHUB_OUTPUT"

  # Nothing is built, let alone published, unless these pass on that commit.
  # dagster_designer's own checks: type check, frontend tests, backend tests, the browser smoke test, Windows path guards.
  product-tests:
    needs: resolve
    uses: eric-thomas-dagster/dagster_designer/.github/workflows/ci.yml@main
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # This repo's own tests: the shell's Rust unit tests (keychain, editor paths, ...) and the release logic.
  rust-tests:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main repo (for ../backend resources)
        uses: actions/checkout@v4
        with:
          repository: eric-thomas-dagster/dagster_designer
          ref: ${{ needs.resolve.outputs.sha }}
          path: dagster_designer
      - name: Checkout this repo into dagster_designer/src-tauri
        uses: actions/checkout@v4
        with:
          path: dagster_designer/src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Create placeholder vendor/uv binaries
        run: |
          mkdir -p dagster_designer/src-tauri/vendor/uv
          touch dagster_designer/src-tauri/vendor/uv/uv dagster_designer/src-tauri/vendor/uv/uvx
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dagster_designer/src-tauri
      - name: Rust unit tests
        working-directory: dagster_designer/src-tauri
        run: cargo test --bin dagster-designer
      - name: Release script tests
        working-directory: dagster_designer/src-tauri
        run: ./scripts/test-auto-release.sh

  # What changed since the previous release: the commit subjects in dagster_designer between the commit the
  # last release recorded ("Built from dagster_designer@<sha>" in its notes) and the one being built now.
  notes:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo (full history, for the changelog)
        uses: actions/checkout@v4
        with:
          repository: eric-thomas-dagster/dagster_designer
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          PREV=$(gh release view latest --repo "${{ github.repository }}" --json body -q .body 2>/dev/null | grep -o 'dagster_designer@[0-9a-f]\{7,40\}' | head -1 | cut -d@ -f2 || true)
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then RANGE="$PREV..$SHA"; else RANGE="-30 $SHA"; fi
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s' $RANGE | grep -viE '^- (tests?|ci|chore)(\(.*\))?:' || true
            echo
            echo "Built from dagster_designer@${SHA:0:7}"
          } > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    needs: [resolve, notes, product-tests, rust-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Same sibling-repo layout as ci.yml, but this time frontend/ is
      # needed too (beforeBuildCommand actually builds it for real here,
      # not just checked for path existence).
      - name: Checkout main repo (for ../backend and ../frontend)
        uses: actions/checkout@v4
        with:
          repository: eric-thomas-dagster/dagster_designer
          ref: ${{ needs.resolve.outputs.sha }}
          path: dagster_designer
      - name: Checkout this repo into dagster_designer/src-tauri
        uses: actions/checkout@v4
        with:
          path: dagster_designer/src-tauri

      # A real version per build (0.1.<run number>) instead of every installer being "0.1.0", so a build can be
      # told apart from the last one. MSI needs numeric parts <= 65535, which a run number stays well under.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp the version into tauri.conf.json
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          node -e "const fs=require('fs');const p='dagster_designer/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version='$VERSION';if(process.env.HAS_KEY==='true')c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      # Tauri's Linux build needs WebKitGTK and a few desktop libraries (see tauri.app prerequisites).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dagster_designer/src-tauri

      - name: npm ci (root, for the tauri CLI)
        working-directory: dagster_designer
        run: npm ci
      - name: npm ci (frontend)
        working-directory: dagster_designer/frontend
        run: npm ci

      # Real uv binaries this time (unlike ci.yml's empty placeholders) --
      # fetch-uv.mjs dispatches to fetch-uv.sh (macOS, universal2 via lipo)
      # or its own Windows zip-extract path.
      # TAURI_SIGNING_PRIVATE_KEY signs the in-app update packages (the matching
      # public key is in tauri.conf.json's plugins.updater.pubkey).
      - name: Build installer
        working-directory: dagster_designer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build

      - name: Locate built installer(s)
        id: artifacts
        shell: bash
        working-directory: dagster_designer/src-tauri/target/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp dmg/*.dmg "$GITHUB_WORKSPACE/out/"
            if ls macos/*.app.tar.gz >/dev/null 2>&1; then
            # Update package + signature, under fixed names the manifest job relies on.
            cp macos/*.app.tar.gz "$GITHUB_WORKSPACE/out/Dagster-Designer-darwin-aarch64.app.tar.gz"
            cp macos/*.app.tar.gz.sig "$GITHUB_WORKSPACE/out/Dagster-Designer-darwin-aarch64.app.tar.gz.sig"
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp deb/*.deb "$GITHUB_WORKSPACE/out/"
            cp appimage/*.AppImage "$GITHUB_WORKSPACE/out/"
            if ls appimage/*.AppImage.sig >/dev/null 2>&1; then
              # On Linux the AppImage itself is the update package; its signature sits beside it.
              cp appimage/*.AppImage "$GITHUB_WORKSPACE/out/Dagster-Designer-linux-x86_64.AppImage"
              cp appimage/*.AppImage.sig "$GITHUB_WORKSPACE/out/Dagster-Designer-linux-x86_64.AppImage.sig"
            fi
          else
            find msi nsis -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} "$GITHUB_WORKSPACE/out/" \;
            if ls nsis/*-setup.exe.sig >/dev/null 2>&1; then
              cp nsis/*-setup.exe "$GITHUB_WORKSPACE/out/Dagster-Designer-windows-x86_64-setup.exe"
              cp nsis/*-setup.exe.sig "$GITHUB_WORKSPACE/out/Dagster-Designer-windows-x86_64-setup.exe.sig"
            fi
          fi
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Keep the installers as a run artifact (not publishing)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*

      - name: Publish to the rolling "latest" release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (v${{ env.VERSION }})
          body_path: release-notes/notes.md
          make_latest: true
          files: out/*

      # An immutable, versioned copy with the same notes, so an older build stays downloadable.
      - name: Publish the versioned release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-notes/notes.md
          make_latest: false
          files: out/*

  # The updater polls releases/latest/download/latest.json: one manifest naming
  # this build's version and each platform's signed update package.
  manifest:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build and upload latest.json
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "No signing key configured; skipping updater manifest"; exit 0; fi
          VERSION="0.1.${{ github.run_number }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/$REPO/releases/download/v$VERSION"
          gh release download "v$VERSION" --repo "$REPO" --pattern 'Dagster-Designer-*.sig' --dir sigs
          NOTES=$(gh release view "v$VERSION" --repo "$REPO" --json body -q .body | grep '^- ' | head -20 || true)
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat sigs/Dagster-Designer-darwin-aarch64.app.tar.gz.sig)" \
            --arg mac_url "$BASE/Dagster-Designer-darwin-aarch64.app.tar.gz" \
            --arg win_sig "$(cat sigs/Dagster-Designer-windows-x86_64-setup.exe.sig)" \
            --arg win_url "$BASE/Dagster-Designer-windows-x86_64-setup.exe" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
               "windows-x86_64": {signature: $win_sig, url: $win_url}}}' > latest.json
          # Linux joins the feed when its package was signed (the AppImage is the update package there).
          if [ -f sigs/Dagster-Designer-linux-x86_64.AppImage.sig ]; then
            jq --arg sig "$(cat sigs/Dagster-Designer-linux-x86_64.AppImage.sig)" \
               --arg url "$BASE/Dagster-Designer-linux-x86_64.AppImage" \
               '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' latest.json > latest.tmp && mv latest.tmp latest.json
          fi
          cat latest.json
          gh release upload latest latest.json --repo "$REPO" --clobber
          gh release upload "v$VERSION" latest.json --repo "$REPO" --clobber

  # `latest` is one rolling release, and each build only adds its files -- so old versions piled up on it.
  # Keep just this build's installers there (every older build stays downloadable from its own vX.Y.Z release).
  prune-latest:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete previous versions' files from the latest release
        run: |
          VERSION="0.1.${{ github.run_number }}"
          REPO="${{ github.repository }}"
          gh release view latest --repo "$REPO" --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              *"_${VERSION}_"*|latest.json|Dagster-Designer-*) ;;
              *) echo "removing $name"; gh release delete-asset latest "$name" --repo "$REPO" --yes ;;
            esac
          done
